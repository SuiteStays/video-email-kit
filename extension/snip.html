<!doctype html>
<html><head><meta charset="utf-8"><title>__COMPANY__ - select an area</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1720; overflow: hidden; cursor: crosshair; user-select: none; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #pic, #sel { position: absolute; left: 0; top: 0; }
  #tip { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #16202b; color: #fff;
    font: 600 14px Arial, sans-serif; padding: 9px 14px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.4); z-index: 3;
    display: flex; gap: 10px; align-items: center; cursor: default; }
  #tip button { font: 700 13px Arial; border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  #use { background: #4cc9f0; color: #06212f; } #all { background: #fff; color: #16202b; } #x { background: #3a4757; color: #fff; }
  #use:disabled { opacity: .45; cursor: default; }
  #size { position: fixed; z-index: 3; background: rgba(0,0,0,.75); color: #fff; font: 600 12px Arial; padding: 4px 8px;
    border-radius: 6px; pointer-events: none; display: none; }
  #busy { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 700 20px Arial; background: rgba(0,0,0,.6); z-index: 5; }
</style></head>
<body>
  <div id="tip">Drag a box around what you want
    <button id="use" disabled>Use this area (Enter)</button><button id="all">Whole screen</button><button id="x">Cancel (Esc)</button></div>
  <div id="wrap"><canvas id="pic"></canvas><canvas id="sel"></canvas></div>
  <div id="size"></div>
  <div id="busy">Saving...</div>
  <script src="snip.js"></script>
</body></html>
